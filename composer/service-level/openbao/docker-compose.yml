services:
  openbao:
    image: openbao/openbao:2.5.4
    container_name: icscert
    restart: unless-stopped
    # Container log rotation (Docker json-file): at most 3 × 10 MB per container, so logs can never fill the disk.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    command: server -config=/etc/openbao/bao.hcl

    cap_add:
      - IPC_LOCK

    volumes:
      - icscert-volume:/openbao/data
      - ./config/bao.hcl:/etc/openbao/bao.hcl:ro
    tmpfs:
      - /openbao/file
      - /openbao/logs
    networks:
      - ics-network

volumes:
  icscert-volume:
    name: icscert-volume

networks:
  ics-network:
    external: true
    name: ics-network