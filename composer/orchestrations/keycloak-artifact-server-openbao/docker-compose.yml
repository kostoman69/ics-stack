# Project-level orchestration
# Brings together the Keycloak stack, artifact server routing, and OpenBao

services:
  # Include keycloak stack (keycloak + postgres)
  keycloak:
    extends:
      file: ../../service-level/keycloak/docker-compose.yml
      service: keycloak
  
  postgres:
    extends:
      file: ../../service-level/keycloak/docker-compose.yml
      service: postgres
    
  caddy:
    extends:
      file: ../../service-level/keycloak/docker-compose.yml
      service: caddy
    image: caddy:2.11.4-r1
    build:
      context: .
      dockerfile: ../../../images/caddy/Dockerfile
    environment:
      CF_API_TOKEN: ${CF_API_TOKEN}
      # Same variable as the icspki service, so Caddy (which requests the certs) and icspki (which
      # reads them back from the matching storage folder) can never point at different CAs.
      ICS_PKI_ACME_DIRECTORY_URL: ${ICS_PKI_ACME_DIRECTORY_URL:-https://acme-v02.api.letsencrypt.org/directory}
    volumes:
      # we need to override the Caddyfile: host path to the orchestration-specific Caddyfile
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Artifact server: host path where release zips/manifests are placed
      - /data/ics:/data/ics:ro
  
  # OpenBao needs its orchestration-specific config so the public URL matches the proxy host
  openbao:
    extends:
      file: ../../service-level/openbao/docker-compose.yml
      service: openbao
    
  icspki:
    extends:
      file: ../../service-level/ics-pki-provisioning/docker-compose.yml
      service: icspki

volumes:
  icsauth-volume:
    name: icsauth-volume
  icsproxy-volume:
    name: icsproxy-volume
  icsproxy-conf-volume:
    name: icsproxy-conf-volume 
  icscert-volume:
    external: true
    name: icscert-volume

networks:
  ics-network:
    external: true
    name: ics-network